const SOC_MAN = taoSoc(.28), SOC_PHU = taoSoc(.25), LENH_VAO = '> cd ~/inside-my-head';
let khoaMan = null;
function veManHinh(ts, mem, ep = false) {
  if (ts < 0) { if (khoaMan === 'den' && !ep) return false; khoaMan = 'den'; mg.fillStyle = '#05080d'; mg.fillRect(0, 0, MW, MH); return true; }

    let n = 0, acc = 0; while (n < chu.length && acc + lech(k * 97 + n) / cps <= dt) { acc += lech(k * 97 + n) / cps; n++; } return n; });
  let tong = 0, kTro = -1;
  ns.forEach((n, k) => { if (n < 0) return; tong += n; if (n < KICH_BAN[k][0].length || k === KICH_BAN.length - 1 || (k + 1 < KICH_BAN.length && ts < MOC[k + 1])) kTro = k; });

  const vao = typeof p === 'number' ? ss(.3, .82, p) : 0, coLenh = vao > 0 && ts > MOC[MOC.length - 1] + 1;

  let sy = Math.max(.003, Math.pow(ss(0, .45, ts), 2)), sx = Math.max(.02, ss(0, .12, ts));

#web.dong{clip-path:circle(0% at 50% 50%);transition:clip-path .8s cubic-bezier(.7,0,.2,1)}
#nhay{position:fixed;z-index:72;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 46px);display:flex;gap:6px;opacity:0;transition:opacity .8s}   /* 13/11 anh: hạ xuống ngang chữ BLUEZII (khDau top +46) */
@media (max-width:700px){#nhay{top:calc(env(safe-area-inset-top,0px) + 26px)}}
body.hien #nhay{opacity:1}
body.oweb #nhay{display:none}
#nhay button{height:44px;min-width:44px;padding:0 12px;border:0;cursor:pointer;background:#f2f1ea;color:#0b0b0c;font:800 13px/1 'Archivo',sans-serif;font-stretch:90%;text-transform:uppercase;letter-spacing:.01em}
#nhay button:hover,#nhay button[aria-expanded="true"]{background:#0b0b0c;color:#f2f1ea;outline:1px solid #f2f1ea}
#nhay .ba{display:grid;place-content:center;gap:4px}#nhay .ba i{display:block;width:18px;height:2px;background:currentColor}
#dsMenu{position:fixed;z-index:72;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 74px);background:#f2f1ea;color:#0b0b0c;min-width:220px;padding:6px 0;display:none}
#dsMenu.on{display:block}
#dsMenu a{display:flex;gap:10px;align-items:baseline;padding:10px 16px;font:900 26px/1 'Archivo',sans-serif;font-stretch:82%;text-transform:uppercase;letter-spacing:-.02em;color:inherit;text-decoration:none}
#dsMenu a small{font:400 11px/1 'Space Mono',monospace}
#dsMenu a:hover span{background:#0b0b0c;color:#f2f1ea}
body.oweb #dsMenu{display:none}
/* 13/11 (lỗi 1): vuốt trên cảnh 3D do trang tự xử lý (xoay / cuộn) → trình duyệt không chen cử chỉ riêng (vuốt ngang = lùi trang, kéo-để-tải-lại) */
canvas{touch-action:none}
body.coLop #nhay,body.coLop #dsMenu{display:none!important}
body:has(#bThe.mo,#finder.mo) #nhay,body:has(#bThe.mo,#finder.mo) #dsMenu{display:none!important}
/* 13/11 (lỗi 4): điện thoại — menu thành thanh đen dưới đáy, giống thanh của web trắng; --thanh = chiều cao thanh, các nút bám đáy (khung.mjs) cộng thêm */
@media (max-width:700px){
  :root{--thanh:44px}
  body.coLop{--thanh:0px}
  #nutMenu{display:none!important}
  #dsMenu{display:flex;left:0;right:0;top:auto;bottom:0;min-width:0;padding:0 4px env(safe-area-inset-bottom,0px);background:#111214;color:#fff;opacity:0;pointer-events:none;transition:opacity .8s}
  body.hien #dsMenu{opacity:1;pointer-events:auto}
  #dsMenu a{flex:1 1 auto;justify-content:center;align-items:center;min-height:44px;padding:15px 4px 14px;font:900 15px/1 'Archivo',sans-serif;font-stretch:82%;letter-spacing:-.02em;white-space:nowrap}
  #dsMenu a small{display:none}
  #dsMenu a:hover span{background:none;color:inherit}
  #dsMenu a:active span{background:#fff;color:#111214}
}
/* nút đóng cửa sổ Finder (chấm đỏ 12 px): nới vùng bấm ra 44 px */
#bt3 #finder .d.do{position:relative}
#bt3 #finder .d.do::after{content:"";position:absolute;inset:-16px}
/* chừa góc phải trên cho Portfolio → + ≡: đẩy đồng hồ não và bộ đếm bảo tàng xuống */
#naoHud #tp,#bTp{margin-top:52px}
</style>
<div id="nhay"><button type="button" id="nutSkip">Portfolio →</button><button type="button" class="ba" id="nutMenu" aria-label="Menu" aria-expanded="false"><i></i><i></i><i></i></button></div>
<nav id="dsMenu" aria-label="Pages"><a href="#" data-k="room"><small>00</small><span>Intro</span></a><a href="#" data-k="works"><small>01</small><span>Work</span></a><a href="#" data-k="skills"><small>02</small><span>Skill</span></a><a href="#" data-k="about"><small>03</small><span>About</span></a><a href="#" data-k="talk"><small>04</small><span>Contact</span></a></nav>
<script>
(function(){
  const f = document.getElementById('web'), MOB = matchMedia('(max-width:760px), (pointer:coarse)').matches;
  let daTai = false, tuHo = false, daGiai = false, webSan = false, choBao = null;
  const gui = m => { try { f.contentWindow.postMessage(m, '*'); } catch (e) {} };
  // tải web trước (ẩn) khi đứng ở hố đen → hút xong hiện ngay, không màn chờ
  function taiTruoc(){ if (daTai) return; daTai = true; f.src = 'web/index.html?ho=1'; }
  setInterval(() => { try { const B = window.__BT; if (!daTai && B && B.u && B.u() > (B.info ? 0 : 0) && document.body.classList.contains('bt')) { const ds = document.querySelectorAll('#bt3 #bang article').length; if (ds && B.u() >= ds - 1.6) taiTruoc(); } } catch (e) {} }, 400);
  function trangThai(){ gui({bz:'trangthai', bt: tuHo, nhac: window.__amBat ? window.__amBat() : false, pl: window.__playlist ? window.__playlist() : null}); }
  window.__baoWeb = trangThai;
  // 13/11 anh: thấy bảo tàng bắt đầu vỡ khối (tSup ≥ 3,9 s) → loang trắng + giấu chữ; tua ngược thì gỡ ra
  setInterval(() => { const t = window.__tSup || 0, b = document.body;
    if (t >= 3.9 && b.classList.contains('bt') && !b.classList.contains('trang')) b.classList.add('trang');
    else if (t < 3.9 && b.classList.contains('trang') && !b.classList.contains('oweb')) b.classList.remove('trang'); }, 60);
  function hien(trang){
    if (document.body.classList.contains('trang')) f.classList.add('trang');
    f.classList.add('on'); document.body.classList.add('oweb');
    requestAnimationFrame(() => { f.classList.remove('dong'); f.classList.add('mo'); });
    const bao = () => { trangThai(); gui({bz:'hien', trang: trang || null}); try { f.contentWindow.focus(); } catch (e) {} };
    // sửa 13/11: trước đây bấm Skip / menu lúc web chưa tải thì lệnh "hien" gửi vào khung còn trống (about:blank) và mất → web hiện thiếu tên + giới thiệu, menu không mở đúng trang. Nay đợi web báo "hoi" (đã sẵn sàng) rồi mới gửi.
    if (webSan) bao(); else choBao = bao;
  }
  // vào web: qua hố đen (giữ bảo tàng tạm dừng để tua ngược) hoặc Skip/menu (trả hết bộ nhớ 3D)
  function moWeb(trang, quaHo){
    if (f.classList.contains('on')) { if (trang) gui({bz:'hien', trang}); return; }
    tuHo = !!quaHo; taiTruoc();
    try { window.__BT && window.__BT.dung && window.__BT.dung(); } catch (e) {}
    hien(trang);
    if (!tuHo) setTimeout(() => { try { if (!daGiai) { daGiai = true; window.__giaiPhong && window.__giaiPhong(); } } catch (e) {} }, 1500);
  }
  // tua ngược: web khép lại thành chấm giữa màn → bảo tàng chạy ngược cảnh hút
  function veBT(){
    if (!tuHo || !window.__BT) { veNha(); return; }
    f.classList.remove('mo', 'trang'); f.classList.add('dong'); window.__tSup = 0;
    document.body.classList.remove('oweb', 'trang');
    try { window.__BT.chay(); } catch (e) {}
    window.__veLai && window.__veLai();
    setTimeout(() => { const n = document.getElementById('luiRa'); n && n.click(); }, 80);
    setTimeout(() => { f.classList.remove('on', 'dong'); }, 820);
  }
  function veNha(){ history.replaceState(null, '', location.pathname + location.search); location.reload(); }
  addEventListener('scene3:xong', () => moWeb(null, true));
  addEventListener('message', e => { if (e.source !== f.contentWindow || !e.data) return; const d = e.data;
    if (d.bz === 've-phong') veNha();
    else if (d.bz === 've-bt') veBT();
    else if (d.bz === 'tron') { try { window.__batTron && window.__batTron(); } catch (er) {} trangThai(); }
    else if (d.bz === 'phat') { try { window.__phatBai && window.__phatBai(d.id); } catch (er) {} trangThai(); }
    else if (d.bz === 'nhac') { try { window.__datAm && window.__datAm(!!d.bat); } catch (er) {} trangThai(); }
    else if (d.bz === 'hoi') { webSan = true; trangThai(); if (choBao) { const b = choBao; choBao = null; b(); } } });
  // nút Skip + menu ≡ (chỉ các trang portfolio: Work trở đi)
  const nm = document.getElementById('nutMenu'), ds = document.getElementById('dsMenu');
  document.getElementById('nutSkip').onclick = () => moWeb(null, false);
  nm.onclick = () => { const on = !ds.classList.contains('on'); ds.classList.toggle('on', on); nm.setAttribute('aria-expanded', on); };
  ds.querySelectorAll('a').forEach(a => a.onclick = ev => { ev.preventDefault(); ds.classList.remove('on'); nm.setAttribute('aria-expanded', 'false');
    if (a.dataset.k === 'room') { const b = document.body.classList; if (b.contains('nao') || b.contains('bt') || (window.__pPhong || 0) > .05) veNha(); return; }   // 13/11: Creative Room = về scene 1 (như nút "Back to creative room"); đang đứng ở đầu phòng thì không tải lại
    moWeb(a.dataset.k, false); });
  addEventListener('pointerdown', ev => { if (ds.classList.contains('on') && !ds.contains(ev.target) && !nm.contains(ev.target)) { ds.classList.remove('on'); nm.setAttribute('aria-expanded', 'false'); } });
  // 13/11 (lỗi 2): đang mở pop-up (bảng "Open the file", cửa sổ Finder) thì ẩn Portfolio → / ≡ / thanh menu để không đè nút đóng
  setInterval(() => document.body.classList.toggle('coLop', !!document.querySelector('#bThe.mo, #finder.mo')), 120);
  if (location.hash === '#web') moWeb(null, false);
  window.__moWeb = moWeb;
})();
</script>
